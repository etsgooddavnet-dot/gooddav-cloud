<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GOOD DAV CLOUD V5.1 FINAL</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#060a12;color:#fff}.top{background:#000;border-bottom:3px solid #FFD600;padding:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{color:#FFD600;font-weight:900}.btn{padding:7px 12px;border-radius:7px;font-weight:900;cursor:pointer;border:2px solid #000;font-size:11px;margin:2px}.gold{background:#FFD600;color:#000}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#2563eb;color:#fff}.black{background:#111;color:#FFD600;border-color:#FFD600}.card{background:#0f172a;border:2px solid #FFD600;border-radius:12px;padding:10px;margin:8px}input,select{width:100%;padding:9px;background:#000;border:2px solid #334155;border-radius:7px;color:#fff;font-weight:700;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}.fileCard{background:#101a2f;border:2px solid #334155;border-radius:10px;padding:8px;text-align:center;cursor:pointer}.folderCard{border-color:#FFD600;background:#1a1f00}.fileIcon{font-size:32px}.fileName{font-size:10px;font-weight:800;word-break:break-all;height:26px;overflow:hidden}.drop{border:3px dashed #FFD600;border-radius:10px;padding:15px;text-align:center;margin:8px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}.box{background:#0f172a;border:3px solid #FFD600;border-radius:12px;padding:10px;width:100%;max-width:480px}.bread{color:#FFD600;font-weight:900;cursor:pointer;font-size:12px}.linkCard{background:#111a2f;border-left:4px solid #22c55e;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div class="top"><div class="logo">☁️ GOOD DAV CLOUD V5.1 FINAL<br><small style="font-size:9px">DOSSIERS + LIENS EXPORT/IMPORT</small></div><div><button class="btn black" onclick="document.getElementById('setupCard').style.display='block'">⚙️ CONFIG</button><button class="btn gold" onclick="loadAll()">🔄 ACTUALISER</button></div></div>
<div id="setupCard" class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="color:#FFD600;font-size:10px">USERNAME</label><input id="ghUser"></div><div><label style="color:#FFD600;font-size:10px">REPO</label><input id="ghRepo"></div><div><label style="color:#FFD600;font-size:10px">TOKEN</label><input id="ghToken" type="password"></div><div><label style="color:#FFD600;font-size:10px">DOSSIER RACINE</label><input id="ghPath"></div></div><button class="btn green" style="margin-top:8px" onclick="saveSettings()">💾 SAUVEGARDER</button><span id="connStatus"></span></div>

<div class="card" style="border-color:#22c55e"><h3 style="color:#22c55e;margin:2px">🔗 MES LIENS EXTERNES</h3>
<div style="display:grid;grid-template-columns:1fr 1fr 110px auto;gap:6px;align-items:end"><div><label style="color:#FFD600;font-size:9px">TITRE</label><input id="linkTitle" placeholder="Tuto Excel"></div><div><label style="color:#FFD600;font-size:9px">URL</label><input id="linkUrl" placeholder="https://..."></div><div><label style="color:#FFD600;font-size:9px">CAT</label><select id="linkCat"><option>Formation</option><option>Logiciel</option><option>Site</option><option>YouTube</option><option>Autre</option></select></div><button class="btn gold" onclick="addLink()">💾</button></div>
<div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap"><button class="btn blue" onclick="exportJSON()">📥 JSON</button><button class="btn green" onclick="exportExcel()">📊 EXCEL</button><button class="btn gold" onclick="document.getElementById('importJsonInput').click()">📤 IMPORTER JSON</button><input type="file" id="importJsonInput" accept=".json" style="display:none"><span id="linkCount" style="font-size:10px;color:#94a3b8;margin-left:10px"></span></div>
<div id="linksList" style="margin-top:8px"></div>
</div>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div id="breadcrumb"></div><div style="display:flex;gap:4px"><button class="btn blue" onclick="createFolder()">📁 DOSSIER</button></div></div><div class="drop" id="dropZone" onclick="document.getElementById('upInput').click()">📤 GLISSE FICHIERS ICI (dans dossier actuel)<input type="file" id="upInput" multiple style="display:none"></div><div class="grid" id="fileGrid"></div><div id="log" style="margin-top:8px;padding:6px;background:#000;border-radius:6px;font-size:10px;color:#22c55e"></div></div>
<div id="previewModal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h3 id="prevTitle" style="color:#FFD600;font-size:12px"></h3><button class="btn red" onclick="closeModal('previewModal')">X</button></div><div id="prevBody"></div><div style="text-align:center;margin-top:8px"><button class="btn gold" id="btnDownload">⬇️ DOWNLOAD</button><button class="btn blue" id="btnRename">✏️ RENOMMER</button><button class="btn red" id="btnDelete">🗑️ SUPPRIMER</button></div></div></div>
<script>
let cfg=JSON.parse(localStorage.getItem('gooddav_gh_cfg')||'{}');
if(!cfg.path)cfg.path='cloud';if(!cfg.repo)cfg.repo='gooddav-cloud-storage';if(!cfg.user)cfg.user='etsgooddavnet-dot';
document.getElementById('ghUser').value=cfg.user||'';document.getElementById('ghRepo').value=cfg.repo||'';document.getElementById('ghToken').value=cfg.token||'';document.getElementById('ghPath').value=cfg.path||'cloud';
let files=[],links=[],curPath='';
function saveSettings(){cfg.user=document.getElementById('ghUser').value.trim();cfg.repo=document.getElementById('ghRepo').value.trim();cfg.token=document.getElementById('ghToken').value.trim();cfg.path=document.getElementById('ghPath').value.trim()||'cloud';localStorage.setItem('gooddav_gh_cfg',JSON.stringify(cfg));testConnection();}
async function testConnection(){try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok){document.getElementById('connStatus').textContent='✅ Connecté';document.getElementById('setupCard').style.display='none';loadAll();}else{document.getElementById('connStatus').textContent='❌ '+r.status;}}catch(e){document.getElementById('connStatus').textContent='❌ '+e.message;}}
function loadAll(){loadFiles();loadLinksSafe();}
function fullPath(){let base=cfg.path||'cloud';return curPath?base+'/'+curPath:base;}
function renderBread(){let base=cfg.path||'cloud';let html=`<span class="bread" onclick="curPath='';loadFiles()">📁 ${base}</span>`;if(curPath){let parts=curPath.split('/');let acc='';parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=` / <span class="bread" onclick="curPath='${acc}';loadFiles()">${p}</span>`;});}document.getElementById('breadcrumb').innerHTML=html;}
// LIENS SAFE
async function loadLinksSafe(){try{let p=(cfg.path||'cloud')+'/links.json';let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.status===404){links=[];renderLinks();return;}let d=await r.json();let txt=atob(d.content);links=JSON.parse(txt);renderLinks();}catch(e){links=[];renderLinks();}}
function renderLinks(){let div=document.getElementById('linksList');document.getElementById('linkCount').textContent=links.length+' liens';if(!links.length){div.innerHTML='<small style="color:#94a3b8">Aucun lien - ajoute ou importe un JSON</small>';return;}div.innerHTML=links.map((l,i)=>`<div class="linkCard"><div><b style="color:#FFD600">${l.title||l.name||'Sans titre'}</b> <span style="background:#FFD600;color:#000;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:900">${l.cat||l.category||'Autre'}</span><br><a href="${l.url||l.link}" target="_blank" style="color:#60a5fa;font-size:11px;word-break:break-all">${(l.url||l.link||'').slice(0,70)}</a></div><div><button class="btn blue" onclick="window.open('${l.url||l.link}','_blank')">OUVRIR</button><button class="btn red" onclick="delLink(${i})">X</button></div></div>`).join('');}
async function addLink(){let t=document.getElementById('linkTitle').value.trim(),u=document.getElementById('linkUrl').value.trim(),c=document.getElementById('linkCat').value;if(!t||!u){alert('Titre + URL');return;}if(!u.startsWith('http'))u='https://'+u;links.unshift({title:t,url:u,cat:c,date:new Date().toISOString()});await saveLinks();document.getElementById('linkTitle').value='';document.getElementById('linkUrl').value='';renderLinks();}
async function delLink(i){if(!confirm('Supprimer ce lien?'))return;links.splice(i,1);await saveLinks();renderLinks();}
async function saveLinks(){let p=(cfg.path||'cloud')+'/links.json';let content=btoa(unescape(encodeURIComponent(JSON.stringify(links,null,2))));let sha=null;try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok)sha=(await r.json()).sha;}catch(e){}let body={message:'Update links.json',content};if(sha)body.sha=sha;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)alert('Erreur sauvegarde liens: '+await res.text());else document.getElementById('log').textContent='✅ Liens sauvegardés';}
function exportJSON(){if(!links.length){alert('Aucun lien');return;}let blob=new Blob([JSON.stringify(links,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gooddav-links-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function exportExcel(){if(!links.length){alert('Aucun lien');return;}let csv='Titre,URL,Categorie,Date\n';links.forEach(l=>{csv+=`"${(l.title||l.name||'').replace(/"/g,'""')}","${(l.url||l.link||'').replace(/"/g,'""')}","${(l.cat||l.category||'').replace(/"/g,'""')}","${l.date||''}"\n`;});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gooddav-links-'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
document.getElementById('importJsonInput').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let txt=await file.text();let arr=JSON.parse(txt);if(!Array.isArray(arr))arr=[arr];let valid=arr.filter(x=>x.url||x.link).map(x=>({title:x.title||x.name||'Sans titre',url:x.url||x.link,cat:x.cat||x.category||'Autre',date:x.date||x.created_date||new Date().toISOString()}));if(!valid.length){alert('JSON invalide: il faut url');return;}if(confirm(`Importer ${valid.length} liens?`)){links=valid.concat(links);await saveLinks();renderLinks();}}catch(err){alert('Erreur: '+err.message);}e.target.value='';});
// FILES
async function loadFiles(){let fp=fullPath();document.getElementById('log').textContent='⏳ /'+fp;try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${fp}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.status===404){files=[];renderFiles();renderBread();return;}let d=await r.json();files=Array.isArray(d)?d.filter(f=>f.name!=='links.json'):[];renderFiles();renderBread();}catch(e){document.getElementById('log').textContent='❌ '+e.message;}}
function renderFiles(){let grid=document.getElementById('fileGrid');grid.innerHTML='';let sorted=[...files].sort((a,b)=>a.type==='dir'?-1:1);sorted.forEach(f=>{let isDir=f.type==='dir';let card=document.createElement('div');card.className='fileCard'+(isDir?' folderCard':'');let icon=isDir?'📁':f.name.match(/\.jpg|\.png/i)?'🖼️':f.name.match(/\.zip/i)?'📦':'📄';card.innerHTML=`<div class="fileIcon">${icon}</div><div class="fileName">${f.name}</div><div style="font-size:9px;color:#94a3b8">${isDir?'Dossier':(f.size/1024).toFixed(1)+' Ko'}</div>`;card.onclick=()=>{if(isDir){curPath=curPath?curPath+'/'+f.name:f.name;loadFiles();}else openFile(f);};grid.appendChild(card);});}
async function createFolder(){let n=prompt('Nom dossier:');if(!n)return;n=n.trim().replace(/[^a-z0-9-_]/gi,'-');let p=fullPath()+'/'+n+'/.keep';let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Create '+n,content:btoa('keep')})});if(res.ok)loadFiles();}
async function openFile(f){document.getElementById('prevTitle').textContent=f.name;document.getElementById('previewModal').style.display='flex';document.getElementById('prevBody').innerHTML=`<div style="text-align:center">${f.name}<br><a href="${f.download_url}" target="_blank" style="color:#60a5fa;word-break:break-all">${f.download_url}</a></div>`;document.getElementById('btnDownload').onclick=()=>window.open(f.download_url,'_blank');document.getElementById('btnRename').onclick=()=>renameF(f);document.getElementById('btnDelete').onclick=()=>deleteF(f);}
async function renameF(f){let nn=prompt('Nouveau nom:',f.name);if(!nn||nn===f.name)return;let cr=await fetch(f.url,{headers:{Authorization:`token ${cfg.token}`}});let cd=await cr.json();let np=fullPath()+'/'+nn;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${np}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Rename '+f.name,content:cd.content})});if(res.ok){await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Delete old',sha:f.sha})});closeModal('previewModal');loadFiles();}}
async function deleteF(f){if(!confirm('Supprimer '+f.name+'?'))return;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Delete '+f.name,sha:f.sha})});if(res.ok){closeModal('previewModal');loadFiles();}}
function toB64(file){return new Promise((r,j)=>{let rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=j;rd.readAsDataURL(file);});}
async function uploadFile(file){let b64=await toB64(file);let p=fullPath()+'/'+file.name;let sha=null;try{let chk=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(chk.ok)sha=(await chk.json()).sha;}catch(e){}let body={message:'Upload '+file.name,content:b64};if(sha)body.sha=sha;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error(await res.text());}
async function handleUpload(list){for(let file of list){document.getElementById('log').textContent='⏳ Upload '+file.name;await uploadFile(file);}loadFiles();}
document.getElementById('upInput').addEventListener('change',e=>handleUpload(e.target.files));
let dz=document.getElementById('dropZone');dz.addEventListener('dragover',e=>{e.preventDefault();});dz.addEventListener('drop',e=>{e.preventDefault();handleUpload(e.dataTransfer.files);});
function closeModal(id){document.getElementById(id).style.display='none';}
if(cfg.token)testConnection();
</script></body></html>
