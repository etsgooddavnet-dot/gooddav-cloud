<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GOOD DAV CLOUD V4.1 FIX</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#060a12;color:#fff}.top{background:#000;border-bottom:3px solid #FFD600;padding:10px;display:flex;justify-content:space-between;align-items:center}.logo{color:#FFD600;font-weight:900}.btn{padding:7px 12px;border-radius:7px;font-weight:900;cursor:pointer;border:2px solid #000;font-size:11px;margin:2px}.gold{background:#FFD600;color:#000}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#2563eb;color:#fff}.black{background:#111;color:#FFD600;border-color:#FFD600}.card{background:#0f172a;border:2px solid #FFD600;border-radius:12px;padding:10px;margin:8px}input{width:100%;padding:9px;background:#000;border:2px solid #334155;border-radius:7px;color:#fff;font-weight:700;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}.fileCard{background:#101a2f;border:2px solid #334155;border-radius:10px;padding:8px;text-align:center;cursor:pointer}.folderCard{border-color:#FFD600;background:#1a1f00}.fileIcon{font-size:32px}.fileName{font-size:10px;font-weight:800;word-break:break-all;height:26px;overflow:hidden}.drop{border:3px dashed #FFD600;border-radius:10px;padding:15px;text-align:center;margin:8px;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}.box{background:#0f172a;border:3px solid #FFD600;border-radius:12px;padding:10px;width:100%;max-width:480px}.bread{color:#FFD600;font-weight:900;cursor:pointer;font-size:12px}</style></head><body>
<div class="top"><div class="logo">☁️ GOOD DAV CLOUD V4.1 FIX</div><div><button class="btn black" onclick="document.getElementById('setupCard').style.display='block'">⚙️ CONFIG</button><button class="btn gold" onclick="loadFiles()">🔄 ACTUALISER</button></div></div>
<div id="setupCard" class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="color:#FFD600;font-size:10px">USERNAME</label><input id="ghUser"></div><div><label style="color:#FFD600;font-size:10px">REPO</label><input id="ghRepo"></div><div><label style="color:#FFD600;font-size:10px">TOKEN</label><input id="ghToken" type="password"></div><div><label style="color:#FFD600;font-size:10px">DOSSIER RACINE</label><input id="ghPath"></div></div><button class="btn green" style="margin-top:8px" onclick="saveSettings()">💾 SAUVEGARDER</button><span id="connStatus"></span></div>
<div class="card"><div style="display:flex;justify-content:space-between"><div id="breadcrumb" style="color:#FFD600;font-weight:900">📁 /</div><button class="btn blue" onclick="createFolder()">📁 NOUVEAU DOSSIER</button></div><div class="drop" id="dropZone" onclick="document.getElementById('upInput').click()">📤 CLIQUE OU GLISSE FICHIERS ICI<input type="file" id="upInput" multiple style="display:none"></div><div class="grid" id="fileGrid"></div><div id="log" style="margin-top:8px;padding:6px;background:#000;border-radius:6px;font-size:10px;color:#22c55e"></div></div>
<div id="previewModal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h3 id="prevTitle" style="color:#FFD600;font-size:12px"></h3><button class="btn red" onclick="closeModal('previewModal')">X</button></div><div id="prevBody"></div><div style="text-align:center;margin-top:8px"><button class="btn gold" id="btnDownload">⬇️ DOWNLOAD</button><button class="btn blue" id="btnRename">✏️ RENOMMER</button><button class="btn red" id="btnDelete">🗑️ SUPPRIMER</button></div></div></div>
<script>
let cfg=JSON.parse(localStorage.getItem('gooddav_gh_cfg')||'{}');
if(!cfg.path)cfg.path='cloud';if(!cfg.repo)cfg.repo='gooddav-cloud-storage';if(!cfg.user)cfg.user='etsgooddavnet-dot';
document.getElementById('ghUser').value=cfg.user||'';document.getElementById('ghRepo').value=cfg.repo||'';document.getElementById('ghToken').value=cfg.token||'';document.getElementById('ghPath').value=cfg.path||'cloud';
let files=[],curPath='';
function saveSettings(){cfg.user=document.getElementById('ghUser').value.trim();cfg.repo=document.getElementById('ghRepo').value.trim();cfg.token=document.getElementById('ghToken').value.trim();cfg.path=document.getElementById('ghPath').value.trim()||'cloud';localStorage.setItem('gooddav_gh_cfg',JSON.stringify(cfg));testConnection();}
async function testConnection(){try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok){document.getElementById('connStatus').textContent='✅ Connecté';document.getElementById('setupCard').style.display='none';loadFiles();}else{document.getElementById('connStatus').textContent='❌ Erreur '+r.status;document.getElementById('setupCard').style.display='block';}}catch(e){document.getElementById('connStatus').textContent='❌ '+e.message;}}
function fullPath(){let base=cfg.path||'cloud';return curPath?base+'/'+curPath:base;}
function renderBread(){let base=cfg.path||'cloud';let html=`<span class="bread" onclick="curPath='';loadFiles()">📁 ${base}</span>`;if(curPath){let parts=curPath.split('/');let acc='';parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=` / <span class="bread" onclick="goTo('${acc}')">${p}</span>`;});}document.getElementById('breadcrumb').innerHTML=html;}
function goTo(p){curPath=p;loadFiles();}
async function loadFiles(){let fp=fullPath();document.getElementById('log').textContent='⏳ Chargement /'+fp+'...';try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${fp}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.status===404){files=[];renderFiles();renderBread();document.getElementById('log').textContent='📁 Dossier vide /'+fp;return;}let d=await r.json();files=Array.isArray(d)?d:[];renderFiles();renderBread();document.getElementById('log').textContent=`✅ ${files.length} éléments`; }catch(e){document.getElementById('log').textContent='❌ '+e.message;}}
function renderFiles(){let grid=document.getElementById('fileGrid');grid.innerHTML='';let sorted=[...files].sort((a,b)=>{if(a.type!==b.type)return a.type==='dir'?-1:1;return a.name.localeCompare(b.name);});sorted.forEach(f=>{let isDir=f.type==='dir';let card=document.createElement('div');card.className='fileCard'+(isDir?' folderCard':'');let icon=isDir?'📁':f.name.match(/\.jpg|\.png/i)?'🖼️':f.name.match(/\.zip/i)?'📦':'📄';card.innerHTML=`<div class="fileIcon">${icon}</div><div class="fileName">${f.name}</div><div style="font-size:9px;color:#94a3b8">${isDir?'Dossier':(f.size/1024).toFixed(1)+' Ko'}</div>`;card.onclick=()=>{if(isDir){curPath=curPath?curPath+'/'+f.name:f.name;loadFiles();}else openFile(f);};grid.appendChild(card);});}
async function createFolder(){let n=prompt('Nom du dossier:');if(!n)return;n=n.trim().replace(/[^a-zA-Z0-9-_]/g,'-');if(!n)return;let p=fullPath()+'/'+n+'/.keep';document.getElementById('log').textContent='⏳ Création '+n+'...';let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Create folder '+n,content:btoa('keep')})});if(res.ok){document.getElementById('log').textContent='✅ Dossier '+n+' créé';loadFiles();}else{document.getElementById('log').textContent='❌ Erreur création';}}
async function openFile(f){document.getElementById('prevTitle').textContent=f.name;document.getElementById('previewModal').style.display='flex';document.getElementById('prevBody').innerHTML=`<div style="text-align:center;padding:10px">${f.name}<br>${(f.size/1024).toFixed(1)} Ko<br><br><a href="${f.download_url}" target="_blank" style="color:#60a5fa;word-break:break-all">${f.download_url}</a></div>`;document.getElementById('btnDownload').onclick=()=>window.open(f.download_url,'_blank');document.getElementById('btnRename').onclick=()=>renameF(f);document.getElementById('btnDelete').onclick=()=>deleteF(f);}
async function renameF(f){let nn=prompt('Nouveau nom:',f.name);if(!nn||nn===f.name)return;document.getElementById('log').textContent='⏳ Renommage...';let cr=await fetch(f.url,{headers:{Authorization:`token ${cfg.token}`}});let cd=await cr.json();let np=fullPath()+'/'+nn;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${np}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Rename '+f.name+' to '+nn,content:cd.content})});if(res.ok){await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Delete old '+f.name,sha:f.sha})});closeModal('previewModal');loadFiles();}else alert('Erreur renommage');}
async function deleteF(f){if(!confirm('Supprimer '+f.name+' ?'))return;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Delete '+f.name,sha:f.sha})});if(res.ok){closeModal('previewModal');loadFiles();}else alert('Erreur suppression');}
function toB64(file){return new Promise((r,j)=>{let rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=j;rd.readAsDataURL(file);});}
async function uploadFile(file){let b64=await toB64(file);let p=fullPath()+'/'+file.name;let sha=null;try{let chk=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(chk.ok)sha=(await chk.json()).sha;}catch(e){}let body={message:'Upload '+file.name,content:b64};if(sha)body.sha=sha;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error(await res.text());}
async function handleUpload(list){for(let file of list){try{document.getElementById('log').textContent='⏳ Upload '+file.name;await uploadFile(file);}catch(e){document.getElementById('log').textContent='❌ '+e.message.slice(0,100);return;}}loadFiles();}
document.getElementById('upInput').addEventListener('change',e=>handleUpload(e.target.files));
let dz=document.getElementById('dropZone');dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.background='rgba(255,214,0,0.2)';});dz.addEventListener('dragleave',()=>dz.style.background='');dz.addEventListener('drop',e=>{e.preventDefault();dz.style.background='';handleUpload(e.dataTransfer.files);});
function closeModal(id){document.getElementById(id).style.display='none';}
if(cfg.token)testConnection();else document.getElementById('setupCard').style.display='block';
</script></body></html>
