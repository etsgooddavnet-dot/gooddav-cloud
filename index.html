<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GOOD DAV NET CLOUD V4 - Dossiers</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#060a12;color:#fff;min-height:100vh}.top{background:#000;border-bottom:3px solid #FFD600;padding:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{color:#FFD600;font-weight:900;font-size:16px}.btn{padding:8px 12px;border-radius:7px;font-weight:900;cursor:pointer;border:2px solid #000;font-size:11px;margin:2px}.gold{background:#FFD600;color:#000}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#2563eb;color:#fff}.black{background:#111;color:#FFD600;border-color:#FFD600}.card{background:#0f172a;border:2px solid #FFD600;border-radius:12px;padding:12px;margin:10px}input,select{width:100%;padding:10px;background:#000;border:2px solid #334155;border-radius:7px;color:#fff;font-weight:700;margin-top:4px}.field{margin-top:8px}.field label{font-size:10px;font-weight:900;color:#FFD600;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}.fileCard{background:#101a2f;border:2px solid #334155;border-radius:10px;padding:10px;text-align:center;cursor:pointer;position:relative}.fileCard:hover{border-color:#FFD600}.folderCard{background:#1a1f00;border-color:#FFD600}.fileIcon{font-size:36px}.fileName{font-size:10px;font-weight:800;word-break:break-all;margin-top:4px;height:28px;overflow:hidden}.fileSize{font-size:9px;color:#94a3b8}.drop{border:3px dashed #FFD600;border-radius:12px;padding:15px;text-align:center;margin:10px;cursor:pointer;background:rgba(255,214,0,0.05)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:10px}.box{background:#0f172a;border:3px solid #FFD600;border-radius:12px;padding:12px;width:100%;max-width:500px}.badge{background:#FFD600;color:#000;padding:2px 6px;border-radius:10px;font-size:9px;font-weight:900}.bread{color:#FFD600;font-weight:900;font-size:13px;cursor:pointer}.bread:hover{text-decoration:underline}.actionBtn{position:absolute;top:4px;right:4px;display:flex;gap:2px}.mini{font-size:9px;padding:3px 5px;border-radius:5px;border:none;cursor:pointer;font-weight:900}.linkCard{background:#111a2f;border-left:4px solid #FFD600;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div class="top"><div class="logo">☁️ GOOD DAV NET CLOUD V4<br><small style="font-size:9px;color:#fff">DOSSIERS - RENOMMER - LIENS</small></div><div><button class="btn black" onclick="openSettings()">⚙️ CONFIG</button><button class="btn gold" onclick="loadAll()">🔄 ACTUALISER</button></div></div>
<div id="setupCard" class="card" style="border-color:#ef4444"><h3 style="color:#ef4444;margin:4px">🔐 Config GitHub</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>USERNAME</label><input id="ghUser"></div><div class="field"><label>REPO</label><input id="ghRepo" value="gooddav-cloud-storage"></div><div class="field"><label>TOKEN</label><input id="ghToken" type="password"></div><div class="field"><label>DOSSIER RACINE</label><input id="ghPath" value="cloud"></div></div><div style="margin-top:8px"><button class="btn green" onclick="saveSettings()">💾 SAUVEGARDER</button><span id="connStatus" style="margin-left:10px;font-weight:900"></span></div></div>

<div class="card" style="border-color:#22c55e"><h3 style="color:#22c55e;margin:4px">🔗 LIEN EXTERNE</h3><div style="display:grid;grid-template-columns:1fr 1fr 120px auto;gap:6px;align-items:end"><div class="field"><label>TITRE</label><input id="linkTitle" placeholder="Tuto Excel"></div><div class="field"><label>URL</label><input id="linkUrl" placeholder="https://..."></div><div class="field"><label>CAT</label><select id="linkCat"><option>Formation</option><option>Logiciel</option><option>Site</option><option>YouTube</option><option>Autre</option></select></div><button class="btn gold" onclick="addLink()">💾</button></div><div id="linksList" style="margin-top:8px"></div></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div id="breadcrumb"></div><div style="display:flex;gap:4px;align-items:center"><button class="btn blue" onclick="createFolderPrompt()">📁 NOUVEAU DOSSIER</button><input id="search" placeholder="🔍" style="width:120px;padding:6px" oninput="filterFiles()"></div></div>
<div class="drop" id="dropZone" onclick="document.getElementById('upInput').click()"><b style="color:#FFD600">📤 GLISSE FICHIERS ICI (dans le dossier actuel)</b><br><small style="color:#94a3b8">Tout format</small><input type="file" id="upInput" multiple style="display:none"></div>
<div class="grid" id="fileGrid"></div>
<div id="log" style="margin-top:10px;padding:8px;background:#000;border-radius:6px;font-size:10px;color:#22c55e"></div>
</div>

<div id="previewModal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h3 id="prevTitle" style="color:#FFD600;font-size:12px"></h3><button class="btn red" onclick="closeModal('previewModal')">X</button></div><div id="prevBody"></div><div style="text-align:center;margin-top:10px"><button class="btn gold" id="btnDownload">⬇️ TÉLÉCHARGER</button><button class="btn blue" id="btnRename">✏️ RENOMMER</button><button class="btn red" id="btnDelete">🗑️ SUPPRIMER</button></div></div></div>

<script>
let cfg=JSON.parse(localStorage.getItem('gooddav_gh_cfg')||'null')||{user:'etsgooddavnet-dot',repo:'gooddav-cloud-storage',token:'',path:'cloud'};
document.getElementById('ghUser').value=cfg.user;document.getElementById('ghRepo').value=cfg.repo;document.getElementById('ghToken').value=cfg.token;document.getElementById('ghPath').value=cfg.path;
let filesCache=[],linksCache=[],currentPath='',currentPreview=null;
function saveSettings(){cfg.user=document.getElementById('ghUser').value.trim();cfg.repo=document.getElementById('ghRepo').value.trim();cfg.token=document.getElementById('ghToken').value.trim();cfg.path=document.getElementById('ghPath').value.trim();if(!cfg.user||!cfg.repo||!cfg.token){alert('Remplis');return;}localStorage.setItem('gooddav_gh_cfg',JSON.stringify(cfg));testConnection();}
function openSettings(){document.getElementById('setupCard').style.display='block';}
async function testConnection(){try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok){document.getElementById('connStatus').textContent='✅ Connecté';document.getElementById('setupCard').style.display='none';loadAll();}else{document.getElementById('connStatus').textContent='❌ '+r.status;}}catch(e){document.getElementById('connStatus').textContent='❌ '+e.message;}}
function loadAll(){loadFiles();loadLinks();}
function getFullPath(){return cfg.path?(currentPath?`${cfg.path}/${currentPath}`:cfg.path):currentPath;}
// LINKS
async function loadLinks(){try{let p=cfg.path?`${cfg.path}/links.json`:'links.json';let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.status===404){linksCache=[];renderLinks();return;}let d=await r.json();linksCache=JSON.parse(decodeURIComponent(escape(atob(d.content))));renderLinks();}catch(e){linksCache=[];renderLinks();}}
function renderLinks(){let div=document.getElementById('linksList');if(!linksCache.length){div.innerHTML='<small style="color:#94a3b8">Aucun lien</small>';return;}div.innerHTML=linksCache.map((l,i)=>`<div class="linkCard"><div><b style="color:#FFD600">${l.title}</b> <span class="badge">${l.cat}</span><br><a href="${l.url}" target="_blank" style="color:#60a5fa;font-size:11px">${l.url.slice(0,50)}</a></div><div><button class="btn blue" onclick="window.open('${l.url}','_blank')">OUVRIR</button><button class="btn red" onclick="delLink(${i})">X</button></div></div>`).join('');}
async function addLink(){let t=document.getElementById('linkTitle').value.trim(),u=document.getElementById('linkUrl').value.trim(),c=document.getElementById('linkCat').value;if(!t||!u){alert('Titre+URL');return;}if(!u.startsWith('http'))u='https://'+u;linksCache.unshift({title:t,url:u,cat:c,date:new Date().toISOString()});await saveLinks();document.getElementById('linkTitle').value='';document.getElementById('linkUrl').value='';renderLinks();}
async function delLink(i){if(!confirm('Supprimer?'))return;linksCache.splice(i,1);await saveLinks();renderLinks();}
async function saveLinks(){let p=cfg.path?`${cfg.path}/links.json`:'links.json';let content=btoa(unescape(encodeURIComponent(JSON.stringify(linksCache,null,2))));let sha=null;try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.ok){sha=(await r.json()).sha;}}catch(e){}let body={message:'Update links',content};if(sha)body.sha=sha;await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${p}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});}

// FILES & FOLDERS
async function loadFiles(){let full=getFullPath();let apiPath=full?`/contents/${full}`:'/contents';document.getElementById('log').textContent='⏳ Chargement '+ (full||'racine')+'...';try{let r=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}${apiPath}`,{headers:{Authorization:`token ${cfg.token}`}});if(r.status===404){filesCache=[];renderFiles();renderBread();document.getElementById('log').textContent='📁 Dossier vide';return;}let data=await r.json();if(!Array.isArray(data)){filesCache=[];}else{filesCache=data.filter(f=>f.name!=='links.json');}renderFiles();renderBread();document.getElementById('log').textContent=`✅ ${filesCache.length} éléments dans /${full}`;}catch(e){document.getElementById('log').textContent='❌ '+e.message;}}
function renderBread(){let root=cfg.path||'racine';let parts=currentPath?currentPath.split('/'):[];let html=`<span class="bread" onclick="goToPath('')">📁 ${root}</span>`;let acc='';parts.forEach((p,i)=>{acc+= (acc?'/':'')+p;html+=` / <span class="bread" onclick="goToPath('${acc}')">${p}</span>`;});document.getElementById('breadcrumb').innerHTML=html;}
function goToPath(p){currentPath=p;loadFiles();}
function renderFiles(list=filesCache){let grid=document.getElementById('fileGrid');grid.innerHTML='';let q=document.getElementById('search').value.toLowerCase();let filtered=list.filter(f=>!q||f.name.toLowerCase().includes(q));filtered.sort((a,b)=>{if(a.type!==b.type)return a.type==='dir'?-1:1;return a.name.localeCompare(b.name);});filtered.forEach(f=>{let isDir=f.type==='dir';let card=document.createElement('div');card.className='fileCard'+(isDir?' folderCard':'');let icon=isDir?'📁':getIcon(f.name);let size=isDir?'Dossier':(f.size/1024).toFixed(1)+' Ko';card.innerHTML=`<div class="fileIcon">${icon}</div><div class="fileName">${f.name}</div><div class="fileSize">${size}</div>${!isDir?'<span class="badge">Fichier</span>':''}`;card.onclick=()=>{if(isDir){currentPath=currentPath?currentPath+'/'+f.name:f.name;loadFiles();}else{openFile(f);}};grid.appendChild(card);});}
function getIcon(n){if(n.match(/\.(jpg|png|jpeg|gif|webp)$/i))return'🖼️';if(n.match(/\.(mp3|wav|m4a)$/i))return'🎵';if(n.match(/\.(mp4|avi|mov)$/i))return'🎬';if(n.match(/\.(zip|rar)$/i))return'📦';if(n.match(/\.html$/i))return'🌐';if(n.match(/\.(exe|apk)$/i))return'💿';return'📄';}
function filterFiles(){renderFiles();}
async function createFolderPrompt(){let name=prompt('Nom du nouveau dossier:');if(!name)return;name=name.trim().replace(/[^a-zA-Z0-9-_ ]/g,'-');if(!name)return;let fullPath=getFullPath()?`${getFullPath()}/${name}/.keep`:`${name}/.keep`;document.getElementById('log').textContent='⏳ Création dossier '+name+'...';try{let body={message:`Create folder ${name}`,content:btoa('dossier GOOD DAV NET')};let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${fullPath}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(res.ok){document.getElementById('log').textContent='✅ Dossier créé: '+name;loadFiles();}else{alert('Erreur: '+await res.text());}}catch(e){alert(e.message);}}
async function openFile(f){currentPreview=f;document.getElementById('prevTitle').textContent=f.name;let body=document.getElementById('prevBody');body.innerHTML='⏳...';document.getElementById('previewModal').style.display='flex';let url=f.download_url;if(f.name.match(/\.(jpg|png|jpeg|gif|webp)$/i))body.innerHTML=`<img src="${url}" style="width:100%;border-radius:8px">`;else if(f.name.match(/\.(mp3|wav|m4a)$/i))body.innerHTML=`<audio controls src="${url}" style="width:100%"></audio>`;else if(f.name.match(/\.(mp4|webm)$/i))body.innerHTML=`<video controls src="${url}" style="width:100%"></video>`;else body.innerHTML=`<div style="text-align:center;padding:20px">${f.name}<br>${(f.size/1024).toFixed(1)} Ko</div>`;document.getElementById('btnDownload').onclick=()=>window.open(url,'_blank');document.getElementById('btnRename').onclick=()=>renameFile(f);document.getElementById('btnDelete').onclick=()=>deleteFile(f);}
async function renameFile(f){let newName=prompt('Nouveau nom pour '+f.name+' :',f.name);if(!newName||newName===f.name)return;document.getElementById('log').textContent='⏳ Renommage '+f.name+' → '+newName+'...';try{let contentRes=await fetch(f.url,{headers:{Authorization:`token ${cfg.token}`}});let contentData=await contentRes.json();let newPath=getFullPath()?`${getFullPath()}/${newName}`:newName;let createRes=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${newPath}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Rename ${f.name} to ${newName}`,content:contentData.content,sha:contentData.sha})});if(!createRes.ok)throw new Error(await createRes.text());await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Delete old ${f.name}`,sha:f.sha})});document.getElementById('log').textContent='✅ Renommé en '+newName;closeModal('previewModal');loadFiles();}catch(e){alert('Erreur renommage: '+e.message);}}
async function deleteFile(f){if(!confirm('Supprimer définitivement '+f.name+' ?'))return;try{let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${f.path}`,{method:'DELETE',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Delete '+f.name,sha:f.sha})});if(res.ok){document.getElementById('log').textContent='🗑️ Supprimé: '+f.name;closeModal('previewModal');loadFiles();}else{alert(await res.text());}}catch(e){alert(e.message);}}
function toBase64(file){return new Promise((r,j)=>{let rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=j;rd.readAsDataURL(file);});}
async function uploadFile(file){let b64=await toBase64(file);let path=getFullPath()?`${getFullPath()}/${file.name}`:file.name;let sha=null;try{let chk=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${path}`,{headers:{Authorization:`token ${cfg.token}`}});if(chk.ok)sha=(await chk.json()).sha;}catch(e){}let body={message:`Upload ${file.name}`,content:b64};if(sha)body.sha=sha;let res=await fetch(`https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error((await res.text()).slice(0,200));}
async function handleUpload(files){for(let file of files){try{document.getElementById('log').textContent='⏳ Upload '+file.name+' dans /'+getFullPath();await uploadFile(file);document.getElementById('log').textContent='✅ Upload OK: '+file.name;}catch(e){document.getElementById('log').textContent='❌ '+e.message;return;}}loadFiles();}
document.getElementById('upInput').addEventListener('change',e=>handleUpload(e.target.files));let dz=document.getElementById('dropZone');dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.background='rgba(255,214,0,0.2)';});dz.addEventListener('dragleave',()=>dz.style.background='rgba(255,214,0,0.05)');dz.addEventListener('drop',e=>{e.preventDefault();dz.style.background='rgba(255,214,0,0.05)';handleUpload(e.dataTransfer.files);});
function closeModal(id){document.getElementById(id).style.display='none';}
if(cfg.token)testConnection();
</script></body></html>
